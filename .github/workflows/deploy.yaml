name: Deploy to GitHub Pages

on:
  push:
    branches:
      - portfolio_edits

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5 # Upgraded to modern Node 24 baseline

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Swapped to native Node 24 execution
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
