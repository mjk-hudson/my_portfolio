name: Deploy to GitHub Pages

on:
  push:
    branches:
      - portfolio_edits # Listens specifically to your edits branch

permissions:
  contents: write # Grants GitHub permission to generate the gh-pages deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite output directory
          branch: gh-pages # Live production deployment target branch