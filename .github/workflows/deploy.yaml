name: Deploy to GitHub Pages

on:
  push:
    branches:
      - portfolio_edits

# Explicit permissions required to write to public gh-pages branches
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Force-clears system runtime warnings
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Clean install dependencies
        run: npm ci

      - name: Debug File System
        run: |
          echo "=== Where am I right now? ==="
          pwd
          echo "=== Checking src/components contents ==="
          ls -la src/components
          echo "=== Checking assets contents ==="
          ls -R src/assets

      - name: Build application
        run: npm run build

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }} # Passes security tokens directly to the plugin
